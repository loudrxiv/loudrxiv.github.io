# Builds the Hugo site and deploys it to GitHub Pages.
#   - every push to main, plus manual runs: build, then deploy
#   - pushes to dev and PRs into main: build only (checks that the site compiles; nothing is published)
name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref. A newer push cancels an older run on the same ref, except on main:
# a production deploy is never cancelled part-way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with module.hugoVersion.min in hugo.yaml (PaperMod needs >= 0.158.0).
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "${base}/${deb}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check
          sudo dpkg -i "${deb}"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive # themes/PaperMod
          fetch-depth: 0 # full history, for enableGitInfo
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
