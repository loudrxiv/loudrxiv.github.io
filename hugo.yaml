baseURL: "https://loudrxiv.github.io/"
title: The entrance of the cave
theme: PaperMod
locale: en-US
copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
enableRobotsTXT: true

module:
  hugoVersion:
    min: "0.158.0"

minify:
  disableXML: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers search

menu:
  main:
    - {name: work, url: /work/, weight: 10}
    - {name: tags, url: /tags/, weight: 20}
    - {name: search, url: /search/, weight: 30}
    - {name: more info, url: /info, weight: 40}

privacy:
  youtube:
    privacyEnhanced: true

params:
  env: production
  author: Mark Maher Ebeid
  description: Mark Ebeid, machine learning scientist. Causal machine learning and sequence-to-function models for biology.
  keywords: [Machine Learning, Computational Biology, Causal Machine Learning, Causal Discovery,
            Sequence-to-Function, Domain Adaptation, Genomics, Metabolomics, Science Communication]
  defaultTheme: dark
  disableThemeToggle: true # dark only
  yard: true # animated yard backdrop; false removes it
  hideMeta: true
  ShowToc: false

  assets:
    disableHLJS: true
    favicon: "/loudrxiv_logo.ico"
    favicon16x16: "/loudrxiv_logo_16-16.png"
    favicon32x32: "/loudrxiv_logo_32-32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  label:
    text: loudRxiv
    icon: /snail.gif

  profileMode:
    enabled: true
    title: the preprint server for myself
    subtitle: "mark's online notebook about his life"
    buttons:
      - {name: About, url: about}
      - {name: Work, url: work}

  socialIcons:
    - {name: linkedin, url: "https://www.linkedin.com/in/markebeid/"}
    - {name: github, url: "https://github.com/loudrxiv"}
    - {name: googlescholar, url: "https://scholar.google.com/citations?user=SKi3GSMAAAAJ&hl=en"}
    - {name: email, url: "mailto:markebeid@pitt.edu"}
